<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        width: 1400px; height: 560px; overflow: hidden;
        background: linear-gradient(120deg, #2f6df6 0%, #6f5bff 100%);
        color: #fff;
        font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex; align-items: center; gap: 64px; padding: 0 96px;
      }
      img { width: 168px; height: 168px; border-radius: 40px; box-shadow: 0 18px 46px rgba(0,0,0,.28); flex: none; }
      h1 { margin: 0 0 12px; font-size: 58px; font-weight: 700; letter-spacing: -0.03em; }
      p { margin: 0; font-size: 23px; opacity: 0.92; max-width: 820px; }
      ul { margin: 26px 0 0; padding: 0; list-style: none; display: flex; gap: 14px; flex-wrap: wrap; }
      li { border: 1px solid rgba(255,255,255,.4); border-radius: 999px; padding: 7px 17px; font-size: 15px; }
    </style>
  </head>
  <body>
    <img src="../icon-128.png" alt="" />
    <div>
      <h1>Read It To Me</h1>
      <p>Listen to any page in a natural, human-sounding voice — using the free neural voices already on your computer.</p>
      <ul>
        <li>No account</li>
        <li>No API key</li>
        <li>No subscription</li>
        <li>Nothing collected</li>
        <li>Open source</li>
      </ul>
    </div>
  </body>
</html>
