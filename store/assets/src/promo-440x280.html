<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; }
      body {
        width: 440px; height: 280px; overflow: hidden;
        background: linear-gradient(135deg, #2f6df6 0%, #6f5bff 100%);
        color: #fff; text-align: center;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
      }
      img { width: 76px; height: 76px; border-radius: 18px; box-shadow: 0 10px 26px rgba(0,0,0,.25); }
      h1 { margin: 0; font-size: 27px; font-weight: 700; letter-spacing: -0.02em; }
      p { margin: 0; font-size: 14px; opacity: 0.9; }
    </style>
  </head>
  <body>
    <img src="../icon-128.png" alt="" />
    <h1>Read It To Me</h1>
    <p>Any page, out loud, in a human voice.<br />Free. Private. No account.</p>
  </body>
</html>
